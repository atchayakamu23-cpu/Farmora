{% extends "base.html" %}
{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Review {{ product.name }}</h1>
        <form method="POST">
            {% csrf_token %}
            {% for field in form %}
            <div class="form-group">
                <label>{{ field.label }}</label>
                {{ field }}
                {% for error in field.errors %}
                    <small class="error">{{ error }}</small>
                {% endfor %}
            </div>
            {% endfor %}
            <button type="submit" class="btn">Save Review</button>
            <a href="{% url 'product_detail' product.id %}" class="secondary-btn">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
