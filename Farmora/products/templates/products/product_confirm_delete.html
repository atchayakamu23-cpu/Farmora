{% extends "base.html" %}
{% block content %}
<div class="form-page">
    <div class="form-card">
        <h1>Delete Product</h1>
        <p>Delete <strong>{{ product.name }}</strong>?</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="danger-btn">Yes, Delete</button>
            <a href="{% url 'my_products' %}" class="secondary-btn">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
