{% extends "base.html" %}
{% block content %}
<div class="page-container">
    <h1>My Orders</h1>
    {% for order in orders %}
    <div class="order-card">
        <div>
            <h2>Order #{{ order.id }}</h2>
            <p>{{ order.created_at|date:"d M Y, h:i A" }}</p>
            <p>Total: <strong>₹{{ order.total_amount }}</strong></p>
        </div>
        <div>
            <span class="status">{{ order.get_status_display }}</span>
            <a href="{% url 'order_detail' order.id %}" class="secondary-btn">View Order</a>
        </div>
    </div>
    {% empty %}
    <div class="empty-state">
        <h2>No orders yet.</h2>
        <a href="{% url 'product_list' %}" class="btn">Start Shopping</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
